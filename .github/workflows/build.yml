name: Build WatchSync Desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements_gui.txt
      - run: QT_QPA_PLATFORM=offscreen python -m unittest discover -s tests -v

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          architecture: x64
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Build portable app
        shell: pwsh
        run: .\packaging\build_windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: WatchSync-Desktop-1.7.6-Windows-x64
          path: dist/WatchSync Desktop
      - uses: actions/upload-artifact@v6
        if: ${{ hashFiles('dist/WatchSync-Desktop-1.7.6-Setup.exe') != '' }}
        with:
          name: WatchSync-Desktop-1.7.6-Setup
          path: dist/WatchSync-Desktop-1.7.6-Setup.exe
      # Publish straight from the runner. Pulling a 28 MB artifact down to a
      # laptop and pushing it back up is the slowest and least reliable leg of
      # the release, so the machine that built the installer attaches it.
      - name: Attach installer to the release
        if: ${{ github.ref == 'refs/heads/watchsync-desktop' && hashFiles('dist/WatchSync-Desktop-1.7.6-Setup.exe') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.7.6 "dist/WatchSync-Desktop-1.7.6-Setup.exe" --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install universal2 Python
        run: |
          curl -LO https://www.python.org/ftp/python/3.10.6/python-3.10.6-macos11.pkg
          sudo installer -pkg python-3.10.6-macos11.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.10/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools==70.3.0 wheel
      - name: Build and ad-hoc sign
        run: |
          ./packaging/build_macos.sh
          ditto -c -k --sequesterRsrc --keepParent "dist/WatchSync Desktop.app" "dist/WatchSync-Desktop-1.7.6-macOS-universal.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: WatchSync-Desktop-1.7.6-macOS-universal
          path: dist/WatchSync-Desktop-1.7.6-macOS-universal.zip
      - name: Attach app archive to the release
        if: ${{ github.ref == 'refs/heads/watchsync-desktop' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.7.6 "dist/WatchSync-Desktop-1.7.6-macOS-universal.zip" --clobber --repo "$GITHUB_REPOSITORY"
